# CI do HyperFrame: typecheck, testes e build só dos workspaces afetados.
# Roda em pull requests e em push na main. Não gera o bundle nativo do Tauri
# (isso fica no release.yml), só o bundle Vite do app.
#
#   plan   -> descobre os workspaces (campo "workspaces" do package.json raiz),
#             vê o que mudou e monta a matrix (.github/scripts/ci-plan.mjs)
#   check  -> um job por (workspace, script) da matrix
#   ci-ok  -> agregador; é o único status check que precisa ser obrigatório
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# um run por ref; um push novo cancela o anterior
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      empty: ${{ steps.plan.outputs.empty }}
    steps:
      # histórico completo para o diff (merge-base no PR, before..sha no push),
      # mas sem blobs: o diff --name-only só precisa das árvores
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      # lê o evento de $GITHUB_EVENT_PATH; push sem "before" e workflow_dispatch rodam tudo
      - id: plan
        run: node .github/scripts/ci-plan.mjs

  check:
    name: ${{ matrix.task }} ${{ matrix.workspace }}
    needs: plan
    if: needs.plan.outputs.empty == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci --no-audit --no-fund

      - run: npm run "$TASK" -w "$WORKSPACE"
        env:
          TASK: ${{ matrix.task }}
          WORKSPACE: ${{ matrix.workspace }}

  # passa quando tudo que rodou passou, ou quando nada precisava rodar
  # (ex.: PR só de docs); falha se o plan ou algum check falhou/foi cancelado
  ci-ok:
    name: ci-ok
    if: always()
    needs: [plan, check]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - run: |
          echo "plan=$PLAN check=$CHECK empty=$EMPTY"
          [[ "$PLAN" == success ]] || exit 1
          [[ "$CHECK" == success || ( "$CHECK" == skipped && "$EMPTY" == true ) ]] || exit 1
        env:
          PLAN: ${{ needs.plan.result }}
          CHECK: ${{ needs.check.result }}
          EMPTY: ${{ needs.plan.outputs.empty }}
